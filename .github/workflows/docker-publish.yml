# 共通ワークフロー：Docker イメージをビルドして GHCR（ghcr.io）に公開する。
# 呼び出し側のジョブに permissions: { contents: read, packages: write } が必要。
# 秘密情報はイメージに入れないこと（実行時に環境変数で渡す）。
name: Docker publish

on:
  workflow_call:
    inputs:
      context:
        description: ビルドするフォルダ（Dockerfile のある場所）
        type: string
        required: true
      image:
        description: 公開先のイメージ名。省略時は ghcr.io/<呼び出し元のリポジトリ>
        type: string
        default: ""
      file:
        description: Dockerfile のパス。省略時は <context>/Dockerfile
        type: string
        default: ""
      platforms:
        description: ビルドする CPU アーキテクチャ（例 linux/amd64,linux/arm64）
        type: string
        default: linux/amd64
    outputs:
      image:
        description: 公開したイメージ名（小文字）
        value: ${{ jobs.publish.outputs.image }}
      digest:
        description: 公開したイメージのダイジェスト
        value: ${{ jobs.publish.outputs.digest }}

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      image: ${{ steps.name.outputs.image }}
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - uses: actions/checkout@v5

      # GHCR のイメージ名は小文字でなければならない（リポジトリ名に大文字があっても通るように）
      - id: name
        env:
          IMAGE: ${{ inputs.image || format('ghcr.io/{0}', github.repository) }}
        run: echo "image=${IMAGE,,}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ steps.name.outputs.image }}
          tags: |
            type=raw,value=latest
            type=sha

      - id: build
        uses: docker/build-push-action@v7
        with:
          context: ${{ inputs.context }}
          file: ${{ inputs.file }}
          platforms: ${{ inputs.platforms }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ steps.name.outputs.image }}
          cache-to: type=gha,mode=max,scope=${{ steps.name.outputs.image }}
